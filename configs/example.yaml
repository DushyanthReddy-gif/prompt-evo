
task:
  name: classification
  description: "Classify the sentiment of a short review as 'positive' or 'negative'."
  type: classification
  dataset: data/classification_dev.jsonl
  test_dataset: data/classification_test.jsonl
  seed_prompt: prompts/classification_seed.txt
  manual_prompt: prompts/classification_manual.txt

optimizer:
  population_size: 4
  max_generations: 5
  worker_budget: 100
  mutation_probability: 0.8
  crossover_probability: 0.2
  seed: 42

evaluation:
  initial_slice_size: 20
  promotion_slice_size: 50
  bootstrap_samples: 100
  length_penalty: 0.01

worker:
  provider: openai
  model: gemini-2.5-flash
  api_key_env: GEMINI_API_KEY
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/

optimizer_llm:
  provider: openai
  model: gemini-2.5-flash
  api_key_env: GEMINI_API_KEY
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/

experiment:
  name: gemini_classification
  output_dir: results
  seeds: [1, 2, 3]
  budgets: [100]